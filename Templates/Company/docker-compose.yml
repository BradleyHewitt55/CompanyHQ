name: ${COMPOSE_PROJECT_NAME:-company}
services:
  api:
    build:
      context: .
      dockerfile: Apps/Api/Dockerfile
    # The file the start script chose (.env, or .env.dev in development). Add the API's own settings
    # there, using the standard .NET form Section__Key.
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports: ["127.0.0.1:${API_PORT:-4102}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; cat <&3 | grep -q Healthy'"]
      interval: 3s
      timeout: 5s
      retries: 40
