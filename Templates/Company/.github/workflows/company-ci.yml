name: Company API CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the company API against the pinned packages
        run: dotnet build Apps/Api/Company.Api.csproj -c Release
      # When you add tests, add their step here; the starter ships none.
