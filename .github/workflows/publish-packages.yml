name: Publish packages
# A release is a tag: pushing v1.2.3 tests, packs and publishes every package as 1.2.3. Published
# versions are never replaced, so a company pinned to an older one keeps building.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
  # nuget.org trusts this workflow by its GitHub identity, so no API key is stored anywhere.
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Test the generic services
        run: dotnet test Tests/Services.IntegrationTests.csproj
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the bounded two-language architecture proof
        run: python Experiments/UniversalApi/verify.py
      - name: Pack the generic services and the host library
        run: |
          find Services Apps/Api -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' -print0 |
            xargs -0 -n1 dotnet pack -c Release -o packages -p:Version=${{ steps.version.outputs.version }}
      # Exchanges this run's identity for a short-lived key under the nuget.org Trusted Publishing
      # policy for this repository and workflow file. Renaming this file breaks that policy.
      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: Bradley5
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          FEED: https://api.nuget.org/v3/index.json
          VERSION: ${{ steps.version.outputs.version }}
        # Every other service and Contracts package first, then the generic Rss package: its feed is
        # how companies find complete releases, so it must not precede its siblings. The legacy
        # CompanyHQ.Api host package, kept for companies already pinned to it, goes last.
        # Duplicate versions fail; an immutable release must never be silently reused.
        run: |
          RSS="CompanyHQ.Services.Rss.${VERSION}.nupkg"
          API="CompanyHQ.Api.${VERSION}.nupkg"
          test -f "packages/$RSS" && test -f "packages/$API" || { echo 'expected Rss and Api packages are missing'; exit 1; }
          find packages -name '*.nupkg' ! -name "$API" ! -name "$RSS" -print0 |
            while IFS= read -r -d '' package; do
              dotnet nuget push "$package" --source "$FEED" --api-key "$NUGET_API_KEY"
            done
          dotnet nuget push "packages/$RSS" --source "$FEED" --api-key "$NUGET_API_KEY"
          dotnet nuget push "packages/$API" --source "$FEED" --api-key "$NUGET_API_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: packages/*.nupkg

  # Proves the release is usable the way a company uses it: restored from the feed, not from source.
  consume:
    needs: publish
    uses: ./.github/workflows/verify-consumer.yml
    with:
      version: ${{ needs.publish.outputs.version }}
