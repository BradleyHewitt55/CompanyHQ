<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>New contact message</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f8faf9;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{topic}} enquiry from {{name}}.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8faf9;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e2e7e5;border-radius:16px;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
            <tr>
              <td style="background-color:#00504E;padding:24px 32px;border-bottom:4px solid #00FFA6;">
                <p style="margin:0;font-size:20px;font-weight:800;letter-spacing:-0.02em;color:#ffffff;">CompanyHQ</p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#00504E;">Contact form</p>
                <h1 style="margin:0 0 24px;font-size:24px;line-height:1.2;font-weight:700;color:#1F2933;">New message from {{name}}</h1>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;border:1px solid #e2e7e5;border-radius:12px;">
                  <tr>
                    <td width="110" style="padding:12px 16px;border-bottom:1px solid #e2e7e5;font-size:13px;font-weight:700;color:#667085;">Topic</td>
                    <td style="padding:12px 16px;border-bottom:1px solid #e2e7e5;font-size:14px;color:#1F2933;">{{topic}}</td>
                  </tr>
                  <tr>
                    <td width="110" style="padding:12px 16px;border-bottom:1px solid #e2e7e5;font-size:13px;font-weight:700;color:#667085;">From</td>
                    <td style="padding:12px 16px;border-bottom:1px solid #e2e7e5;font-size:14px;color:#1F2933;word-break:break-all;">{{name}} &lt;{{email}}&gt;</td>
                  </tr>
                  <tr>
                    <td width="110" style="padding:12px 16px;font-size:13px;font-weight:700;color:#667085;">Reference</td>
                    <td style="padding:12px 16px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:13px;color:#1F2933;">{{reference}}</td>
                  </tr>
                </table>
                <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#667085;">Message</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding:16px 20px;background-color:#EAF2F0;border-radius:12px;">
                      <p style="margin:0;font-size:15px;line-height:1.5;color:#1F2933;white-space:pre-wrap;">{{message}}</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;background-color:#EAF2F0;border-top:1px solid #e2e7e5;">
                <p style="margin:0;font-size:12px;line-height:1.45;color:#667085;">Sent from the CompanyHQ contact form. Quote reference {{reference}} when following up.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
